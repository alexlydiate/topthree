name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race. Don't cancel in flight: a half-applied migration
# is worse than a slightly stale deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Apply database migrations
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Link the Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"

      # Idempotent: only migrations the remote hasn't seen are applied, so this
      # is safe to run on every push whether or not the schema changed.
      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase db push

  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    environment: production
    # The frontend can depend on schema that only just landed, so it must not
    # ship if the migration failed.
    needs: migrate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # After the deploy, because `secret put` needs the Worker to exist. On a
      # first-ever deploy that leaves a few seconds where the Worker is up
      # without credentials; every run after this is a no-op unless a value
      # changed. Keeping it here means rotating a key is "update the GitHub
      # secret, re-run the workflow" rather than a manual wrangler invocation.
      - name: Sync runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # printf, not echo: a trailing newline would become part of the value.
          printf '%s' "${{ secrets.SUPABASE_URL }}"      | npx wrangler secret put SUPABASE_URL
          printf '%s' "${{ secrets.SUPABASE_ANON_KEY }}" | npx wrangler secret put SUPABASE_ANON_KEY

      - name: Smoke test
        run: |
          url="${{ vars.SITE_URL }}"
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url/c" || true)
            if [ "$code" = "200" ]; then echo "$url/c -> 200"; exit 0; fi
            echo "attempt $i: got $code, retrying..."; sleep 10
          done
          echo "Deploy went out but $url/c never returned 200."
          exit 1
